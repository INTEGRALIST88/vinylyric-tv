<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinyLyric — Google Cast Web Receiver</title>
  <!-- Google Cast Application Framework (CAF) Receiver SDK v3 -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #08080a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 20% 50%, #101018 0%, #08080a 100%);
    }

    /* ─── PAINEL ESQUERDO: CAPA & DISCO (42%) ─── */
    .left-panel {
      width: 42%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
    }

    .vinyl-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      margin-bottom: 28px;
    }

    .vinyl-disc {
      position: absolute;
      top: 0;
      right: -38px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, #252528 20%, #141418 45%, #050508 100%);
      border: 3px solid #222;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 3s linear infinite;
      animation-play-state: paused;
    }

    .vinyl-disc.spinning {
      animation-play-state: running;
    }

    .vinyl-disc::before {
      content: '';
      position: absolute;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: radial-gradient(circle, #00e5ff 0%, #b388ff 100%);
      opacity: 0.85;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }

    .vinyl-disc::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #08080a;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .album-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 340px;
      height: 340px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      z-index: 2;
      background: #14141c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-fallback {
      font-size: 80px;
      color: rgba(255, 255, 255, 0.2);
    }

    .track-title {
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      margin-top: 12px;
      color: #ffffff;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-artist {
      font-size: 22px;
      color: #00e5ff;
      margin-top: 6px;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-album {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 4px;
      text-align: center;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: #00e5ff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 10px #00e5ff;
    }

    /* ─── PAINEL DIREITO: LETRAS SINCRONIZADAS (58%) ─── */
    .right-panel {
      width: 58%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .lyrics-scroll-container {
      height: 100%;
      overflow-y: hidden;
      padding: 45vh 35px;
      scroll-behavior: smooth;
    }

    .lyric-line {
      font-size: 34px;
      font-weight: 600;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.32);
      text-align: center;
      padding: 14px 26px;
      margin: 6px 0;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 14px;
    }

    .lyric-line.active {
      font-size: 46px;
      font-weight: 800;
      color: #ffffff;
      transform: scale(1.06);
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.85), 0 0 50px rgba(179, 136, 255, 0.5);
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
    }

    .lyric-line.past {
      color: rgba(255, 255, 255, 0.2);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(255, 255, 255, 0.4);
      gap: 16px;
    }

    .empty-state-icon {
      font-size: 64px;
      color: rgba(255, 255, 255, 0.2);
    }

    .empty-state-title {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
    }

    .empty-state-desc {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.3);
    }

    /* ─── CELULAR / TELAS EM PÉ: EMPILHA CAPA EM CIMA E LETRAS EMBAIXO ─── */
    @media (max-width: 820px), (orientation: portrait) {
      html, body {
        height: 100dvh;
      }

      .main-container {
        flex-direction: column;
        height: 100dvh;
      }

      .left-panel {
        width: 100%;
        height: auto;
        flex-shrink: 0;
        padding: 20px 16px 16px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .vinyl-wrapper,
      .vinyl-disc,
      .album-cover {
        width: min(42vw, 180px);
        height: min(42vw, 180px);
      }

      .vinyl-wrapper {
        margin-bottom: 12px;
        margin-right: 20px;
      }

      .vinyl-disc {
        right: -20px;
      }

      .vinyl-disc::before {
        width: 50px;
        height: 50px;
      }

      .album-cover {
        border-radius: 12px;
      }

      .cover-fallback { font-size: 48px; }
      .track-title { font-size: 20px; margin-top: 4px; }
      .track-artist { font-size: 16px; }
      .track-album { font-size: 13px; }

      .status-badge {
        margin-top: 12px;
        padding: 4px 12px;
        font-size: 11px;
      }

      .right-panel {
        width: 100%;
        height: auto;
        flex: 1;
        min-height: 0;
      }

      .lyrics-scroll-container {
        padding: 25vh 12px;
      }

      .lyric-line {
        font-size: 20px;
        padding: 8px 12px;
        margin: 4px 0;
      }

      .lyric-line.active {
        font-size: 26px;
        transform: scale(1.03);
      }

      .empty-state { padding: 0 16px; text-align: center; }
      .empty-state-icon { font-size: 40px; }
      .empty-state-title { font-size: 20px; }
      .empty-state-desc { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="left-panel">
      <div class="vinyl-wrapper">
        <div id="vinylDisc" class="vinyl-disc"></div>
        <div id="albumCover" class="album-cover">
          <div class="cover-fallback">♪</div>
        </div>
      </div>
      <div id="trackTitle" class="track-title">VinyLyric</div>
      <div id="trackArtist" class="track-artist">Google Cast Receiver</div>
      <div id="trackAlbum" class="track-album">Aguardando Vitrola</div>
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">PRONTO PARA TRANSMISSÃO</span>
      </div>
    </div>

    <div class="right-panel">
      <div id="lyricsContainer" class="lyrics-scroll-container">
        <div id="emptyView" class="empty-state">
          <div class="empty-state-icon">♫</div>
          <div class="empty-state-title">Aguardando agulha no vinil...</div>
          <div class="empty-state-desc">Toque no microfone do celular para sincronizar e projetar</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ─── GOOGLE CAST RECEIVER SDK INITIALIZATION ───
    const CUSTOM_CHANNEL = 'urn:x-cast:com.vinylyric.sync';
    let currentLyrics = [];
    let currentActiveIndex = -1;

    try {
      const context = cast.framework.CastReceiverContext.getInstance();

      // Escuta mensagens personalizadas do smartphone VinyLyric
      context.addCustomMessageListener(CUSTOM_CHANNEL, function(customEvent) {
        console.log('[Cast Receiver] Mensagem recebida do celular:', customEvent.data);
        handlePacket(customEvent.data);
      });

      // Inicia o contexto oficial do Google Cast na TV
      context.start();
      console.log('[Cast Receiver] Google Cast Receiver iniciado com sucesso!');
    } catch (e) {
      console.warn('[Cast Receiver] Executando fora do runtime do Chromecast (modo fallback):', e);
    }

    // Suporte também a WebSocket direto se fornecido
    function connectLocalWebSocket(url) {
      try {
        const ws = new WebSocket(url);
        ws.onopen = function() {
          ws.send(JSON.stringify({ type: 'client_ready', deviceName: 'Google Cast TV' }));
        };
        ws.onmessage = function(ev) {
          handlePacket(JSON.parse(ev.data));
        };
      } catch(_) {}
    }

    function handlePacket(data) {
      if (!data) return;
      if (data.type === 'track_loaded') {
        renderTrack(data.track, data.lyrics || []);
      } else if (data.type === 'sync_update') {
        updateSync(data);
      } else if (data.type === 'stop') {
        resetView();
      } else if (data.type === 'connect_ws' && data.wsUrl) {
        connectLocalWebSocket(data.wsUrl);
      }
    }

    function renderTrack(track, lyrics) {
      document.getElementById('trackTitle').innerText = track.title || 'Música Identificada';
      document.getElementById('trackArtist').innerText = track.artist || 'Artista';
      document.getElementById('trackAlbum').innerText = track.album || '';

      const coverContainer = document.getElementById('albumCover');
      if (track.coverUrl && track.coverUrl.length > 5) {
        coverContainer.innerHTML = '<img src="' + track.coverUrl + '" alt="Capa">';
      } else {
        coverContainer.innerHTML = '<div class="cover-fallback">♪</div>';
      }

      currentLyrics = lyrics;
      const lyricsContainer = document.getElementById('lyricsContainer');

      if (!lyrics || lyrics.length === 0) {
        lyricsContainer.innerHTML = '<div class="empty-state"><div class="empty-state-title">Letra Instrumental / Não Encontrada</div></div>';
        return;
      }

      let html = '';
      lyrics.forEach(function(l, idx) {
        const text = l.text ? l.text : '♪';
        html += '<div id="line-' + idx + '" class="lyric-line">' + escapeHtml(text) + '</div>';
      });
      lyricsContainer.innerHTML = html;
      currentActiveIndex = -1;
    }

    function updateSync(data) {
      const activeLine = data.activeLine;
      const isPaused = data.isPaused;
      const disc = document.getElementById('vinylDisc');

      if (isPaused) {
        disc.classList.remove('spinning');
      } else {
        disc.classList.add('spinning');
      }

      if (data.statusMessage) {
        document.getElementById('statusText').innerText = data.statusMessage.toUpperCase();
      }

      if (activeLine !== undefined && activeLine !== currentActiveIndex) {
        if (currentActiveIndex >= 0) {
          const prev = document.getElementById('line-' + currentActiveIndex);
          if (prev) {
            prev.classList.remove('active');
            prev.classList.add('past');
          }
        }

        currentActiveIndex = activeLine;

        if (activeLine >= 0) {
          const current = document.getElementById('line-' + activeLine);
          if (current) {
            current.classList.remove('past');
            current.classList.add('active');
            current.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }
    }

    function resetView() {
      document.getElementById('vinylDisc').classList.remove('spinning');
      document.getElementById('trackTitle').innerText = 'VinyLyric';
      document.getElementById('trackArtist').innerText = 'Google Cast Receiver';
      document.getElementById('trackAlbum').innerText = 'Aguardando Vitrola';
      document.getElementById('albumCover').innerHTML = '<div class="cover-fallback">♪</div>';
      document.getElementById('statusText').innerText = 'PRONTO PARA TRANSMISSÃO';
      document.getElementById('lyricsContainer').innerHTML = 
        '<div id="emptyView" class="empty-state">' +
        '<div class="empty-state-icon">♫</div>' +
        '<div class="empty-state-title">Aguardando agulha no vinil...</div>' +
        '<div class="empty-state-desc">Toque no microfone do celular para sincronizar e projetar</div>' +
        '</div>';
      currentLyrics = [];
      currentActiveIndex = -1;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
