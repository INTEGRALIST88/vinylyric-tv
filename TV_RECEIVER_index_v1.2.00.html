<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VinyLyric TV</title>
  <!-- Google Cast Application Framework (CAF) Receiver SDK v3 -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <style>
    :root {
      --bg: #07070a;
      --text: #f4f4f6;
      --accent: #4fe3ff;
      --line-size: 4.6vh;
      --ease: cubic-bezier(0.22, 0.8, 0.24, 1);

      /* Disco na proporção de um EP / compacto 7" (175 mm, selo ~90 mm): selo ≈ 51% do diâmetro */
      --label-r: 19vh;
      --disc-r: 37vh;
      /* Disco no canto: a borda do selo encosta no topo e na lateral direita da tela */
      --center-y: var(--label-r);
      --deck-x: calc(100vw - var(--label-r));
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── FUNDO AMBIENTE: capa desfocada ─── */
    .ambient {
      position: fixed;
      inset: -10vh -10vw;
      background-size: cover;
      background-position: center;
      filter: blur(80px) saturate(1.3);
      opacity: 0;
      transition: opacity 1.6s ease;
      transform: translateZ(0);
    }
    .ambient.visible { opacity: 0.18; }
    .shade {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 40% 50%, rgba(7, 7, 10, 0.4) 0%, rgba(7, 7, 10, 0.9) 75%);
    }

    /* ─── DISCO (atrás de tudo; a letra passa por cima) ─── */
    .disc-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .disc {
      position: absolute;
      width: calc(var(--disc-r) * 2);
      height: calc(var(--disc-r) * 2);
      left: calc(var(--deck-x) - var(--disc-r));
      top: calc(var(--center-y) - var(--disc-r));
      border-radius: 50%;
      background:
        /* reflexos fixos do vinil (não giram) */
        conic-gradient(from 200deg, rgba(255, 255, 255, 0) 0deg, rgba(255, 255, 255, 0.07) 18deg, rgba(255, 255, 255, 0) 40deg,
                       rgba(255, 255, 255, 0) 180deg, rgba(255, 255, 255, 0.05) 198deg, rgba(255, 255, 255, 0) 220deg),
        /* sulcos concêntricos */
        repeating-radial-gradient(circle at center, #111115 0px, #111115 2px, #1c1c22 2px, #1c1c22 3px);
      box-shadow: 0 0 0 0.5vh #050507, 0 0 0 0.75vh rgba(255, 255, 255, 0.06), 0 1vh 8vh rgba(0, 0, 0, 0.7);
    }
    /* faixa lisa de entrada junto à borda */
    .lead-in {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle closest-side at center, transparent calc(var(--disc-r) - 0.9vh), #18181d calc(var(--disc-r) - 0.9vh));
    }
    /* área já tocada: anel levemente tingido entre a borda e a agulha */
    .played {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle closest-side at center, transparent var(--needle-r, 100%), rgba(79, 227, 255, 0.07) var(--needle-r, 100%));
    }
    /* área lisa final em volta do selo */
    .runout {
      position: absolute;
      border-radius: 50%;
      width: calc((var(--label-r) + 3vh) * 2);
      height: calc((var(--label-r) + 3vh) * 2);
      left: calc(var(--disc-r) - var(--label-r) - 3vh);
      top: calc(var(--disc-r) - var(--label-r) - 3vh);
      background: radial-gradient(circle, #16161b 60%, #121216 100%);
    }
    /* véu sobre a área da letra: disco visível e texto legível */
    .disc-veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(7, 7, 10, 0.55) 0%, rgba(7, 7, 10, 0.45) 60%, rgba(7, 7, 10, 0) 72%);
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-columns: 19vw 1fr 30vw;
      width: 100vw;
      height: 100vh;
    }

    /* ─── ESQUERDA: título, artista, álbum e tempo ─── */
    .meta {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 1.5vw 9vh 3.5vw;
      gap: 1vh;
      min-width: 0;
    }
    .title {
      font-size: 2.7vh;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .artist {
      font-size: 2vh;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .album {
      font-size: 1.6vh;
      color: rgba(244, 244, 246, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .time {
      margin-top: 1.4vh;
      font-size: 1.7vh;
      font-weight: 600;
      color: rgba(244, 244, 246, 0.55);
      font-variant-numeric: tabular-nums;
    }
    .pill {
      margin-top: 1.6vh;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 0.8vh;
      padding: 0.7vh 1.4vh;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 1.45vh;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(244, 244, 246, 0.6);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .pill.visible { opacity: 1; }
    .pill .dot {
      width: 0.9vh;
      height: 0.9vh;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 1.2vh var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }

    /* ─── CENTRO: letra centralizada, 3 linhas em destaque ─── */
    .lyrics {
      position: relative;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
    }
    .lines {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      padding: 0 2vw;
      transition: transform 0.8s var(--ease);
      will-change: transform;
    }
    .line {
      text-align: center;
      font-size: var(--line-size);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      padding: 1vh 0;
      transform-origin: center center;
      transition: transform 0.7s var(--ease), color 0.6s ease;
      /* linhas distantes: menores e escuras */
      transform: scale(0.62);
      color: rgba(244, 244, 246, 0.16);
    }
    .line.d2 { transform: scale(0.76); color: rgba(244, 244, 246, 0.24); }
    /* as 3 linhas principais (anterior, atual e próxima): mesmo tamanho, em destaque.
       Uma pequena diferença de timestamp fica quase imperceptível. */
    .line.d1, .line.d0 { transform: scale(1); color: rgba(244, 244, 246, 0.92); }
    .line.d0 { color: #ffffff; text-shadow: 0 0 3vh rgba(79, 227, 255, 0.25); }
    .line.gap { font-size: calc(var(--line-size) * 0.8); }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 2vw;
      gap: 1.6vh;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .placeholder.visible { opacity: 1; }
    .placeholder .big { font-size: 5vh; font-weight: 800; letter-spacing: -0.02em; }
    .placeholder .small { font-size: 2.2vh; color: rgba(244, 244, 246, 0.45); }

    /* ─── DIREITA: selo (capa girando) e agulha ─── */
    .deck { position: relative; }
    .label {
      position: absolute;
      width: calc(var(--label-r) * 2);
      height: calc(var(--label-r) * 2);
      right: 0;
      top: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #15151b;
      box-shadow: 0 0 0 0.35vh rgba(0, 0, 0, 0.6), 0 1vh 3vh rgba(0, 0, 0, 0.6);
      animation: spin 1.333s linear infinite; /* 45 RPM (EP) */
      animation-play-state: paused;
    }
    body.playing .label { animation-play-state: running; }
    .label img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .label .art {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #23232b 0%, #15151b 70%);
      color: rgba(255, 255, 255, 0.25);
      font-size: 7vh;
    }
    .label::after { /* furo do eixo */
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1.6vh;
      height: 1.6vh;
      margin: -0.8vh 0 0 -0.8vh;
      border-radius: 50%;
      background: #07070a;
      box-shadow: 0 0 0 0.3vh rgba(255, 255, 255, 0.25);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .needle {
      position: absolute;
      left: calc(100% - var(--label-r) - 0.6vw);
      right: -2vw;
      top: 0;
      height: 0;
      will-change: transform;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.has-track .needle { opacity: 1; }
    .needle svg {
      position: absolute;
      left: 0;
      top: -2.6vh;
      width: 100%;
      height: 5.2vh;
      overflow: visible;
      filter: drop-shadow(0 0.6vh 0.8vh rgba(0, 0, 0, 0.75));
    }
    /* tempo da música acompanhando a agulha, à esquerda da ponta */
    .needle-time {
      position: absolute;
      right: calc(100% + 0.9vw);
      top: -1.7vh;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 1.2vh rgba(0, 0, 0, 0.95);
    }
    .needle-time .elapsed { font-size: 2.6vh; font-weight: 800; }
    .needle-time .dur { font-size: 1.7vh; font-weight: 600; color: rgba(244, 244, 246, 0.5); margin-left: 0.4vw; }

    /* ─── AVISOS (virar disco, pausado) ─── */
    .notice {
      position: fixed;
      left: 50%;
      bottom: 6vh;
      transform: translate(-50%, 2vh);
      padding: 1.4vh 3vh;
      border-radius: 999px;
      background: rgba(20, 20, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 2.2vh;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s var(--ease);
      pointer-events: none;
    }
    .notice.visible { opacity: 1; transform: translate(-50%, 0); }

    body.paused .lines { opacity: 0.55; }
  </style>
</head>
<body>
  <div id="ambient" class="ambient"></div>
  <div class="shade"></div>
  <div class="disc-layer">
    <div class="disc">
      <div class="lead-in"></div>
      <div id="played" class="played"></div>
      <div class="runout"></div>
    </div>
    <div class="disc-veil"></div>
  </div>

  <div class="stage">
    <aside class="meta">
      <div id="title" class="title">VinyLyric</div>
      <div id="artist" class="artist">Pronto para tocar</div>
      <div id="album" class="album"></div>
      <div id="time" class="time"></div>
      <div id="pill" class="pill"><span class="dot"></span><span id="pillText">Ouvindo</span></div>
    </aside>

    <main id="lyrics" class="lyrics">
      <div id="lines" class="lines"></div>
      <div id="placeholder" class="placeholder visible">
        <div class="big">Coloque a agulha no disco</div>
        <div class="small">Toque no microfone do celular para sincronizar a letra</div>
      </div>
    </main>

    <section class="deck">
      <div id="label" class="label"><div class="art">♪</div></div>
      <div id="needle" class="needle">
        <div class="needle-time"><span id="elapsed" class="elapsed">0:00</span><span id="dur" class="dur"></span></div>
        <svg viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true">
          <!-- braço (tubo) saindo pela direita -->
          <rect x="54" y="17" width="80" height="6" rx="3" fill="#8a8f98"/>
          <rect x="54" y="17" width="80" height="2" rx="1" fill="#c9ced6" opacity="0.6"/>
          <!-- headshell -->
          <path d="M14 9 H58 L64 15 V25 L58 31 H14 Q9 31 9 26 V14 Q9 9 14 9 Z" fill="#2a2d33" stroke="#4a4f58" stroke-width="1"/>
          <!-- cápsula -->
          <rect x="16" y="13" width="26" height="14" rx="2" fill="#16181c" stroke="#3a3e46" stroke-width="1"/>
          <rect x="18" y="15" width="6" height="10" rx="1" fill="#4fe3ff" opacity="0.85"/>
          <!-- agulha (stylus) tocando o sulco -->
          <circle cx="6" cy="20" r="3.2" fill="#ffffff"/>
          <circle cx="6" cy="20" r="6" fill="#4fe3ff" opacity="0.25"/>
        </svg>
      </div>
    </section>
  </div>

  <div id="notice" class="notice"></div>

  <script>
    'use strict';

    const CUSTOM_CHANNEL = 'urn:x-cast:com.vinylyric.sync';
    // A posição enviada pelo celular já inclui 0.40s de antecipação; a TV antecipa mais 0.45s para a linha ativa
    const LINE_LEAD_SECONDS = 0.45;
    const SENDER_LEAD_SECONDS = 0.40;

    // Geometria do disco em vh (mesmos valores do CSS): a agulha começa no sulco externo (embaixo,
    // junto da borda) e sobe até a área lisa em volta do selo — sulcos de ~96% a ~61% do raio (EP 7").
    const DISC_R = 37;
    const LABEL_R = 19;
    const CENTER_Y = LABEL_R;
    const OUTER_GROOVE = DISC_R * 0.96;
    const INNER_GROOVE = DISC_R * 0.61;

    const el = (id) => document.getElementById(id);
    const vh = () => window.innerHeight / 100;

    // ─── ESTADO ───
    let lyrics = [];          // [{ ms, text }]
    let lineEls = [];
    let activeIndex = -2;
    let durationSec = 0;
    let anchorPos = 0;        // posição (s) no instante anchorAt
    let anchorAt = performance.now();
    let speed = 1;
    let paused = true;
    let hasTrack = false;
    let lastPlayedUpdate = 0;

    // ─── RELÓGIO LOCAL: interpola a posição a 60fps entre os pacotes do celular ───
    function positionAt(now) {
      return paused ? anchorPos : anchorPos + ((now - anchorAt) / 1000) * speed;
    }

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function findActive(ms) {
      let lo = 0, hi = lyrics.length - 1, found = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (lyrics[mid].ms <= ms) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
      }
      return found;
    }

    function radiusAt(frac) {
      return OUTER_GROOVE - frac * (OUTER_GROOVE - INNER_GROOVE);
    }

    // ─── RENDERIZAÇÃO DA FAIXA ───
    function safeUrl(url) {
      return (typeof url === 'string' && /^https?:\/\//i.test(url)) ? url : null;
    }

    function setLabelFallback() {
      const label = el('label');
      label.textContent = '';
      const art = document.createElement('div');
      art.className = 'art';
      art.textContent = '♪';
      label.appendChild(art);
    }

    function renderTrack(track, lines) {
      track = track || {};
      hasTrack = true;
      document.body.classList.add('has-track');
      el('title').textContent = track.title || 'Música identificada';
      el('artist').textContent = track.artist || '';
      el('album').textContent = track.album || '';

      // Capa no selo do disco (girando) e desfocada no fundo
      const label = el('label');
      const ambient = el('ambient');
      const url = safeUrl(track.coverUrl);
      if (url) {
        label.textContent = '';
        const img = document.createElement('img');
        img.alt = '';
        img.onerror = () => { setLabelFallback(); ambient.classList.remove('visible'); };
        img.src = url;
        label.appendChild(img);
        ambient.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
        ambient.classList.add('visible');
      } else {
        setLabelFallback();
        ambient.classList.remove('visible');
      }

      lyrics = Array.isArray(lines) ? lines.filter(l => typeof l.ms === 'number') : [];
      const container = el('lines');
      container.textContent = '';
      lineEls = lyrics.map((l) => {
        const div = document.createElement('div');
        const text = (l.text || '').trim();
        div.className = 'line' + (text ? '' : ' gap');
        div.textContent = text || '♪';
        container.appendChild(div);
        return div;
      });
      activeIndex = -2;
      container.style.transform = 'translate3d(0, 30vh, 0)';

      const lastMs = lyrics.length ? lyrics[lyrics.length - 1].ms : 0;
      durationSec = (track.durationMs && track.durationMs > 0) ? track.durationMs / 1000 : (lastMs ? lastMs / 1000 + 6 : 0);
      el('dur').textContent = durationSec > 0 ? '/ ' + formatTime(durationSec) : '';

      const placeholder = el('placeholder');
      if (lyrics.length === 0) {
        placeholder.querySelector('.big').textContent = '♪ Instrumental';
        placeholder.querySelector('.small').textContent = 'Letra não encontrada para esta faixa';
        placeholder.classList.add('visible');
      } else {
        placeholder.classList.remove('visible');
      }
    }

    // ─── LETRA: 3 linhas principais em destaque, demais menores e escuras ───
    function setActive(index) {
      if (index === activeIndex) return;
      activeIndex = index;
      lineEls.forEach((node, i) => {
        const d = Math.abs(i - index);
        node.classList.toggle('d0', d === 0);
        node.classList.toggle('d1', d === 1);
        node.classList.toggle('d2', d === 2);
      });
      const focus = lineEls[Math.max(0, index)];
      if (!focus) return;
      const viewport = el('lyrics').clientHeight;
      const offset = focus.offsetTop + focus.offsetHeight / 2 - viewport / 2;
      el('lines').style.transform = 'translate3d(0, ' + (-offset) + 'px, 0)';
    }

    // ─── LAÇO DE ANIMAÇÃO (60fps): linha ativa e agulha ───
    function frame(now) {
      if (hasTrack) {
        const pos = positionAt(now);
        if (lyrics.length) {
          setActive(Math.max(0, findActive((pos + LINE_LEAD_SECONDS) * 1000)));
        }
        const realPos = Math.max(0, pos - SENDER_LEAD_SECONDS);
        const frac = durationSec > 0 ? Math.min(1, realPos / durationSec) : 0;
        const r = radiusAt(frac);
        el('needle').style.transform = 'translate3d(0, ' + ((CENTER_Y + r) * vh()) + 'px, 0)';
        const elapsedText = formatTime(realPos);
        el('elapsed').textContent = elapsedText;
        el('time').textContent = durationSec > 0 ? elapsedText + ' / ' + formatTime(durationSec) : elapsedText;
        // O anel "já tocado" redesenha uma área grande: atualiza 4x por segundo
        if (now - lastPlayedUpdate > 250) {
          lastPlayedUpdate = now;
          el('played').style.setProperty('--needle-r', (r / DISC_R * 100).toFixed(2) + '%');
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ─── PACOTES DO CELULAR ───
    function updateSync(data) {
      const now = performance.now();
      const target = typeof data.position === 'number' ? data.position : anchorPos;
      const predicted = positionAt(now);
      const wasPaused = paused;
      paused = !!data.isPaused;
      speed = (typeof data.speedFactor === 'number' && data.speedFactor > 0.5) ? data.speedFactor : 1;
      // Correção suave de pequenos desvios (jitter de rede) e salto direto em realinhamentos reais
      anchorPos = (!wasPaused && Math.abs(predicted - target) < 0.35)
        ? predicted + (target - predicted) * 0.25
        : target;
      anchorAt = now;
      document.body.classList.toggle('paused', paused);
      document.body.classList.toggle('playing', !paused && hasTrack);

      const status = data.status || '';
      const pill = el('pill');
      if (data.isMicActive) {
        el('pillText').textContent = 'Ouvindo o disco';
        pill.classList.add('visible');
      } else {
        pill.classList.remove('visible');
      }
      showNotice(status === 'waitingEndOfSide' ? (data.statusMessage || 'Vire o disco') : (paused ? 'Pausado' : ''));
    }

    function showNotice(text) {
      const notice = el('notice');
      if (text) {
        notice.textContent = text;
        notice.classList.add('visible');
      } else {
        notice.classList.remove('visible');
      }
    }

    function resetView() {
      hasTrack = false;
      lyrics = [];
      lineEls = [];
      activeIndex = -2;
      durationSec = 0;
      paused = true;
      document.body.classList.remove('has-track', 'playing', 'paused');
      el('lines').textContent = '';
      el('title').textContent = 'VinyLyric';
      el('artist').textContent = 'Pronto para tocar';
      el('album').textContent = '';
      el('time').textContent = '';
      el('dur').textContent = '';
      el('elapsed').textContent = '0:00';
      setLabelFallback();
      el('ambient').classList.remove('visible');
      el('played').style.setProperty('--needle-r', '100%');
      el('pill').classList.remove('visible');
      showNotice('');
      const placeholder = el('placeholder');
      placeholder.querySelector('.big').textContent = 'Coloque a agulha no disco';
      placeholder.querySelector('.small').textContent = 'Toque no microfone do celular para sincronizar a letra';
      placeholder.classList.add('visible');
    }

    function handlePacket(data) {
      if (!data || typeof data !== 'object') return;
      if (data.type === 'track_loaded') {
        renderTrack(data.track, data.lyrics || []);
      } else if (data.type === 'sync_update') {
        updateSync(data);
      } else if (data.type === 'stop') {
        resetView();
      } else if (data.type === 'connect_ws' && data.wsUrl && location.protocol === 'http:') {
        connectWebSocket(data.wsUrl);
      }
    }

    const isDemo = new URLSearchParams(location.search).has('demo');

    // ─── TRANSPORTE 1: Google Cast (Chromecast / TV com Cast) ───
    let castContext = null;
    if (typeof cast !== 'undefined' && cast.framework && !isDemo) {
      try {
        castContext = cast.framework.CastReceiverContext.getInstance();
        castContext.addCustomMessageListener(CUSTOM_CHANNEL, (event) => {
          if (event.data && event.data.type === 'hello' && event.senderId) {
            try { castContext.sendCustomMessage(CUSTOM_CHANNEL, event.senderId, { type: 'client_ready' }); } catch (_) {}
          }
          handlePacket(event.data);
        });
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        options.maxInactivity = 3600;
        options.skipPlayersLoad = true;
        castContext.start(options);
      } catch (e) {
        console.warn('[VinyLyric TV] Fora do runtime do Cast:', e);
        castContext = null;
      }
    }

    // ─── TRANSPORTE 2: navegador da TV conectado ao servidor local do celular ───
    let socket = null;
    function connectWebSocket(url) {
      try {
        if (socket) socket.close();
        socket = new WebSocket(url);
        socket.onopen = () => socket.send(JSON.stringify({ type: 'client_ready', deviceName: 'Navegador da TV' }));
        socket.onmessage = (ev) => { try { handlePacket(JSON.parse(ev.data)); } catch (_) {} };
        socket.onclose = () => setTimeout(() => connectWebSocket(url), 2000);
      } catch (_) {}
    }
    if (!castContext && location.protocol === 'http:' && !isDemo) {
      connectWebSocket('ws://' + location.host + '/cast');
    }

    // ─── MODO DEMONSTRAÇÃO (?demo): visualizar o layout sem o celular ───
    if (isDemo) {
      const demoLines = [
        'Esta é uma letra de demonstração', 'para conferir o layout da TV', '',
        'Três linhas ficam em destaque', 'a anterior, a atual e a próxima',
        'todas com o mesmo tamanho', 'assim um pequeno atraso no tempo', 'quase não se percebe', '',
        'As outras linhas diminuem', 'e escurecem conforme se afastam',
        'O texto fica sempre centralizado', 'e a agulha sobe pelo disco', 'da borda até o selo girando', '',
        'Fim da demonstração'
      ];
      renderTrack(
        { title: 'Faixa de Demonstração', artist: 'VinyLyric', album: 'Layout da TV', durationMs: 198000, coverUrl: null },
        demoLines.map((text, i) => ({ ms: 3000 + i * 4000, text }))
      );
      let demoPos = 0;
      updateSync({ position: demoPos, speedFactor: 1, isPaused: false, status: 'calibrated' });
      setInterval(() => {
        demoPos += 0.5;
        updateSync({ position: demoPos + (Math.random() - 0.5) * 0.1, speedFactor: 1, isPaused: false, status: 'calibrated' });
      }, 500);
    }
  </script>
</body>
